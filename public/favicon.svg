<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#052E42" />
      <stop offset="100%" stop-color="#021824" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#62D84E" />
      <stop offset="100%" stop-color="#38B2AC" />
    </linearGradient>
  </defs>

  <!-- Rounded App Tile Background -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="#62D84E" stroke-width="2.5" stroke-opacity="0.45" />

  <!-- Outer Certification Ring -->
  <circle cx="32" cy="32" r="20" stroke="url(#greenGrad)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="98 30" transform="rotate(-35 32 32)" />

  <!-- ServiceNow-style Green Power Dot -->
  <circle cx="46.5" cy="17.5" r="4" fill="#62D84E" />

  <!-- Bold Checkmark Inside Ring -->
  <path d="M23.5 32.5L29.5 38.5L41.5 25.5" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
</svg>

